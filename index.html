<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Deck Builder</title>
  <meta name="description" content="Turn your Magic: The Gathering bulk into playable decks. Import a ManaBox CSV and auto-build 60-card, 40-card, Commander and Pauper decks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%23c9a227'/%3E%3Crect x='9' y='6' width='14' height='12' rx='1' fill='%231b1d24'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/collection">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Bulk Deck Builder</span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#/collection" data-tab="collection">Collection</a>
      <a href="#/build" data-tab="build">Build a deck</a>
      <a href="#/decks" data-tab="decks">My decks</a>
    </nav>
    <div class="topbar-actions">
      <button class="btn ghost small" id="backup-btn" type="button">Backup</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    Card data and images from <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>.
    Your collection and decks are saved in this browser only &mdash; use <em>Backup</em> to keep a copy.
    Not affiliated with Wizards of the Coast.
  </footer>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
